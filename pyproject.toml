[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E402",  # module-import-not-at-top-of-file (evdev/aiohttp deferred imports)
    "E501",  # line-too-long (handled by line-length setting)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]  # unused variables common in test fixtures

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["about", "diagnostics", "dictation_audio", "dictation_config", "dictation_deps", "dictation_output", "dictation_session", "push_to_talk", "server_native", "server_security", "server_whisper_cpp", "vocab", "vocab_editor", "wayvox_paths", "tests"]
